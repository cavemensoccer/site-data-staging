<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Fork Cavemen Soccer</title>
    <link rel="icon" type="image/png" href="./_assets/media/743114cb73f024a44c543e53d752d24d.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }

.hero {
            position: relative;
            width: 100%;
            min-height: 85vh;
            background-image: url('./_assets/media/c750e6c847531fd6065b7ba897169a4e.jpg');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            display: flex;
            align-items: flex-start;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        /* Anchored from the top with a fixed offset rather than vertically
           centered -- centering would re-flow the whole block (including
           items above the one you clicked) every time a nav dropdown
           opens/closes, since growing the content height shifts the
           midpoint used for centering. */
        .side-nav-container {
            position: relative;
            z-index: 2;
            padding: 22vh 8% 40px;
        }

        .side-nav {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .side-nav li {
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 1.5rem;
        }
        .side-nav li:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .side-nav li a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1.25rem;
            letter-spacing: 1.2px;
            display: inline-block;
            border-bottom: 3px solid transparent;
            transition: color 0.3s, border-color 0.3s;
        }

        .side-nav li a:hover {
            border-bottom-color: #fff;
        }

        @media (max-width: 768px) {
            .hero { min-height: 60vh; }
            .side-nav-container { padding: 18vh 5% 30px; }
            .side-nav li a { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header id="site-header"></header>

    <main class="hero">
        <div class="side-nav-container">
            <ul class="side-nav" id="site-nav"></ul>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="nav.js"></script>
    <script>
        initSiteChrome({ headerId: 'site-header', navContentId: 'site-nav', isHome: true });
    </script>
</body>
</html>
